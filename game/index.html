<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Solara City | Open-World Crime Game</title>
<link rel="icon" href="data:,">
<style>
  html,
  body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    background: #0d1b33;
  }
  #game {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
    touch-action: none;
  }
  #status {
    position: absolute;
    width: 1px;
    height: 1px;
    overflow: hidden;
    clip-path: inset(50%);
    white-space: nowrap;
  }
</style>
</head>
<body>
<!-- The whole game draws on this one canvas; main.js boots it. -->
<canvas id="game" aria-label="Solara City, an original open-world crime game. Drive and steal cars, run missions for Marisol Vega, outrun the police, tune the radio, fill the safehouse garage."></canvas>
<p id="status" role="status" aria-live="polite"></p>
<script type="module" src="./src/main.js"></script>
</body>
</html>
